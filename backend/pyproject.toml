[project]
name = "minemind-backend"
version = "1.0.0"
description = "MineMind AI API - manganese exploration and production intelligence (SIH26009)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "artifacts", "data_store"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # ambiguous unicode characters in prose strings
  "B008",  # FastAPI dependency defaults
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["tests", ".venv"]
